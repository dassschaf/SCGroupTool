services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped
    ports:
      - '5173:3000'

    environment:
      DATABASE_URL: postgresql://scgrouptool:${POSTGRES_PASSWORD}@database:5432/scgrouptool
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}

    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:18
    restart: unless-stopped

    environment:
      POSTGRES_USER: scgrouptool
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: scgrouptool

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U scgrouptool -d scgrouptool']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  